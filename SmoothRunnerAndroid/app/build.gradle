apply plugin: 'com.android.application'

android {
    namespace 'com.smoothrunner.gps'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.smoothrunner.gps"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
